name: scanner

on:
  push:
  pull_request:

jobs:
  host-scanner:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDLLGUARD_BUILD_RUNTIME=OFF -DDLLGUARD_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Scan examples
        run: ./build/dllscan examples --source examples --format sarif --out examples.sarif --fail-on none
      - name: Validate SARIF JSON
        run: python3 -m json.tool examples.sarif >/dev/null

  windows-runtime-configure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DDLLGUARD_BUILD_RUNTIME=ON -DDLLGUARD_BUILD_EXAMPLES=ON -DDLLGUARD_BUILD_TESTS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel
